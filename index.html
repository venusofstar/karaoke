<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<meta name="theme-color" content="#000000" />
<meta name="description" content="Fast Karaoke Streaming Website" />
<meta name="robots" content="index, follow" />
<meta property="og:title" content="Karaoke Player" />
<meta property="og:description" content="Ultra Fast Karaoke Website" />
<meta property="og:type" content="website" />
<meta property="og:image" content="cover.webp" />

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="//youtube.com">
<link rel="dns-prefetch" href="//googlevideo.com">

<link rel="preload" href="style.css" as="style">
<link rel="preload" href="app.js" as="script">

<title>Karaoke Website</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#050505;
  --card:#111;
  --text:#fff;
  --accent:#00ff88;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  overflow-x:hidden;
  min-height:100vh;
  contain:content;
}

#loader{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:9999;
}

.spinner{
  width:60px;
  height:60px;
  border:5px solid #222;
  border-top:5px solid var(--accent);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

.loading-text{
  margin-top:20px;
  font-size:14px;
  opacity:.8;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

header{
  padding:18px;
  text-align:center;
  background:#0c0c0c;
  position:sticky;
  top:0;
  z-index:100;
  backdrop-filter:blur(10px);
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.container{
  padding:15px;
  display:grid;
  gap:15px;
}

.card{
  background:var(--card);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 0 20px rgba(0,0,0,.3);
  transform:translateZ(0);
  will-change:transform;
  transition:.3s;
}

.card:hover{
  transform:scale(1.01);
}

.thumb{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  display:block;
}

.song-info{
  padding:14px;
}

.song-title{
  font-size:18px;
  margin-bottom:8px;
}

.play-btn{
  width:100%;
  border:none;
  background:var(--accent);
  color:#000;
  padding:12px;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

.player-wrap{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  overflow:hidden;
  border-radius:16px;
}

iframe{
  width:100%;
  height:100%;
  border:none;
  opacity:0;
  visibility:hidden;
  transition:opacity .4s ease;
  transform:translateZ(0);
  will-change:opacity;
}

iframe.loaded{
  opacity:1;
  visibility:visible;
}

.audio-player{
  width:100%;
  margin-top:15px;
}

footer{
  text-align:center;
  padding:25px;
  opacity:.7;
  font-size:14px;
}

.skeleton{
  height:220px;
  border-radius:16px;
  background:#181818;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%{opacity:.4}
  50%{opacity:1}
  100%{opacity:.4}
}

@media(max-width:768px){
  .logo{
    font-size:20px;
  }

  .song-title{
    font-size:16px;
  }

  .play-btn{
    padding:10px;
  }
}
</style>
</head>
<body>

<div id="loader">
  <div class="spinner"></div>
  <div class="loading-text">Loading Karaoke...</div>
</div>

<header>
  <div class="logo">KARAOKE PLAYER</div>
</header>

<main class="container">

  <div class="card">
    <img
      class="thumb"
      src="cover.webp"
      loading="lazy"
      alt="Karaoke Thumbnail"
    >

    <div class="song-info">
      <div class="song-title">Sample Karaoke Song</div>

      <button class="play-btn" onclick="loadPlayer()">
        PLAY NOW
      </button>
    </div>
  </div>

  <div class="player-wrap">
    <iframe
      id="player"
      loading="lazy"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </div>

  <audio
    class="audio-player"
    controls
    preload="metadata">
    <source src="song.mp3" type="audio/mpeg">
  </audio>

</main>

<footer>
  Optimized Karaoke Streaming Website
</footer>

<script defer>
const iframe = document.getElementById('player');
const loader = document.getElementById('loader');

window.addEventListener('load',()=>{
  setTimeout(()=>{
    loader.style.display='none';
  },800);
});

function loadPlayer(){
  iframe.src='https://example.com';
}

iframe.onload=()=>{
  iframe.classList.add('loaded');
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js');
}

window.addEventListener('scroll',()=>{
  requestAnimationFrame(()=>{});
},{passive:true});
</script>

</body>
</html>
